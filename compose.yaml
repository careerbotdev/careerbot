# CareerBot with Docker Compose: the web app and the step that sets up its Convex deployment, and, in the self-hosted
# profile, Convex itself (its backend and dashboard). Settings come from .env (copy .env.example). Then:
#
#   docker compose up -d
#
# and open http://localhost:3000. With Convex's cloud, .env holds the project's deploy key and URL; with self-hosted
# Convex, .env sets COMPOSE_PROFILES=self-hosted and this file runs Convex too, keeping its data in a Docker volume.
#
# The web app and the setup step are CareerBot's release images (ghcr.io/careerbotdev/careerbot-web and careerbot-setup),
# at the version in CAREERBOT_VERSION; unset, the release this file came with. Updating: back up, read the release
# notes, then `docker compose pull && docker compose up -d` (https://careerbot.dev/docs/self-hosting/updates).
# To build them from this checkout instead: docker compose -f compose.yaml -f compose.build.yaml up -d --build
#
# The self-hosted profile runs the Convex release in CONVEX_RELEASE (an image tag; upgrading:
# https://github.com/get-convex/convex-backend/tree/main/self-hosted).

services:
  web:
    image: ghcr.io/careerbotdev/careerbot-web:${CAREERBOT_VERSION:-0.9.5}
    restart: unless-stopped
    # Published on this machine only (BIND_ADDRESS, default 127.0.0.1): on a server, Coolify's or Dokploy's proxy reaches
    # the containers over Docker's network, and Docker-published ports bypass a host firewall such as ufw. Set
    # BIND_ADDRESS=0.0.0.0 only to reach the ports from other machines without a proxy.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_CONVEX_URL: ${NEXT_PUBLIC_CONVEX_URL:?Set NEXT_PUBLIC_CONVEX_URL in .env}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    depends_on:
      convex-setup:
        condition: service_completed_successfully

  # Deploys CareerBot's functions to Convex and sets its settings, then exits (docker/convex-setup.sh). Until the copy
  # has its owner account it prints a setup code to create it with: docker compose logs convex-setup. Its other
  # commands: docker compose run --rm convex-setup new-setup-code (or reset-password <username>). Always the same
  # version as web: web starts only once this version's functions are deployed.
  convex-setup:
    image: ghcr.io/careerbotdev/careerbot-setup:${CAREERBOT_VERSION:-0.9.5}
    restart: "no"
    environment:
      CONVEX_DEPLOY_KEY: ${CONVEX_DEPLOY_KEY:-}
      CONVEX_SELF_HOSTED_URL: ${CONVEX_SELF_HOSTED_URL:-}
      CONVEX_SELF_HOSTED_ADMIN_KEY: ${CONVEX_SELF_HOSTED_ADMIN_KEY:-}
      # The backend's settings (scripts/sync-convex-env.sh, KEYS). Empty ones are left as they are on the deployment.
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      # A Docker copy is self-hosted: username and password sign-in, the owner adds people (convex/account.ts).
      CAREERBOT_MODE: self-hosted
      SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      GOOGLE_PICKER_KEY: ${GOOGLE_PICKER_KEY:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWKS: ${JWKS:-}
      MASTER_KEY_V1: ${MASTER_KEY_V1:-}
      LIQUIDAI_API_KEY: ${LIQUIDAI_API_KEY:-}
      UPDATE_CHECK: ${UPDATE_CHECK:-}
    volumes:
      - convex-admin:/convex-admin:ro
    depends_on:
      convex-admin-key:
        condition: service_completed_successfully
        required: false

  convex-backend:
    profiles: [self-hosted]
    image: ghcr.io/get-convex/convex-backend:${CONVEX_RELEASE:-5c7cb5bc7db457290f1769f95f1d1340912f7fd7}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONVEX_PORT:-3210}:3210"
      - "${BIND_ADDRESS:-127.0.0.1}:${CONVEX_SITE_PORT:-3211}:3211"
    # Convex reaches itself at NEXT_PUBLIC_CONVEX_URL and CONVEX_SITE_ORIGIN from inside this container: the Node
    # runtime calls back there (Settings, Your data), and sign-ins are checked against the site address. It listens on
    # 3210 and 3211, so with a localhost address on other ports, those ports are passed on to them here too.
    entrypoint:
      - bash
      - -c
      - |
        for pair in "$$CONVEX_PORT:3210" "$$CONVEX_SITE_PORT:3211"; do
          from=$${pair%:*} to=$${pair#*:}
          [ "$$from" = "$$to" ] || node -e 'const net = require("net"); const [from, to] = process.argv.slice(1).map(Number); net.createServer((c) => { const u = net.connect(to, "127.0.0.1"); c.pipe(u).pipe(c); c.on("error", () => u.destroy()); u.on("error", () => c.destroy()); }).listen(from);' "$$from" "$$to" &
        done
        exec ./run_backend.sh
    environment:
      # Where the browser reaches Convex: its API (NEXT_PUBLIC_CONVEX_URL) and its HTTP actions, where Google and
      # GitHub send people back after signing in (CONVEX_SITE_ORIGIN).
      CONVEX_CLOUD_ORIGIN: ${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://localhost:3211}
      CONVEX_PORT: ${CONVEX_PORT:-3210}
      CONVEX_SITE_PORT: ${CONVEX_SITE_PORT:-3211}
    volumes:
      - convex-data:/convex/data
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  # Writes the self-hosted backend's admin key where convex-setup reads it, then exits.
  convex-admin-key:
    profiles: [self-hosted]
    image: ghcr.io/get-convex/convex-backend:${CONVEX_RELEASE:-5c7cb5bc7db457290f1769f95f1d1340912f7fd7}
    restart: "no"
    entrypoint: ["bash", "-c", "./generate_admin_key.sh > /convex-admin/admin_key"]
    volumes:
      - convex-data:/convex/data
      - convex-admin:/convex-admin
    depends_on:
      convex-backend:
        condition: service_healthy

  # Convex's dashboard for the self-hosted backend, at http://localhost:6791. Sign in with the admin key:
  #   docker compose exec convex-backend ./generate_admin_key.sh
  convex-dashboard:
    profiles: [self-hosted]
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_RELEASE:-5c7cb5bc7db457290f1769f95f1d1340912f7fd7}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${NEXT_PUBLIC_CONVEX_URL:-http://localhost:3210}
    depends_on:
      convex-backend:
        condition: service_healthy

volumes:
  convex-data:
  convex-admin:
